name: BaziGB CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bazigb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check AIPDE governance wiring
        run: npm run check:governance && npm run test:governance

      - name: Check task orchestration contracts
        run: npm run test:task-package

      - name: Guard schema, migration and generated changes
        run: npm run test:sensitive-diff && npm run check:sensitive-diff
        env:
          BAZIGB_DIFF_BASE: origin/main
          # DO-RELEASE-001: human-approved runtime datasource isolation change.
          # Exact-file and release-branch scope prevents reusable schema authority.
          BAZIGB_APPROVED_SENSITIVE_FILES: ${{ github.ref_name == 'codex/release-health-contract' && 'apps/server/src/prisma/prisma.service.ts' || '' }}

      - name: Check branch lifecycle fixtures
        run: npm run test:branch-health

      - name: Check Design System contracts
        run: npm run check:design-system && npm run test:design-system

  product-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @bazigb/server

      - name: Initialize and verify synthetic SQLite database
        run: |
          mkdir -p "$RUNNER_TEMP/bazigb-prisma"
          cp apps/server/prisma/schema.prisma "$RUNNER_TEMP/bazigb-prisma/schema.prisma"
          sed -i "s#file:./dev.db#file:${RUNNER_TEMP}/bazigb-ci.db#" "$RUNNER_TEMP/bazigb-prisma/schema.prisma"
          DATABASE_URL="file:${RUNNER_TEMP}/bazigb-ci.db" npm exec --workspace @bazigb/server -- prisma db push --schema "$RUNNER_TEMP/bazigb-prisma/schema.prisma" --skip-generate
          echo "DATABASE_URL=file:${RUNNER_TEMP}/bazigb-ci.db" >> "$GITHUB_ENV"
          DATABASE_URL="file:${RUNNER_TEMP}/bazigb-ci.db" python3 scripts/verify-ci-database.py

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build shared game packages
        run: npm run build:packages

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Test game rules
        run: npm run test:games

      - name: Test server
        run: npm run test -w @bazigb/server

      - name: Build web
        run: npm run build:web

      - name: Build server
        run: npm run build:server

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local BaziGB runtime
        run: npm run dev

      - name: Run loopback browser canary
        run: npm run test:browser-canary
        env:
          BAZIGB_BROWSER_CANARY_URL: http://127.0.0.1:3000

      - name: Stop local BaziGB runtime
        if: always()
        run: npm run dev:stop

      - name: Run product quality gate
        if: always()
        env:
          BAZIGB_BROWSER_CANARY_REPORT: .local-runtime/browser-canary.json
          BAZIGB_PRODUCT_REPORT: ${{ runner.temp }}/bazigb-runtime-diagnostics/product-quality-report.json
        run: node scripts/check-product-quality.mjs

      - name: Capture sanitized runtime diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/bazigb-runtime-diagnostics"
          for log in .local-runtime/server.log .local-runtime/web.log .local-runtime/browser-canary.json; do
            if [ -f "$log" ]; then
              sed -E 's/(JWT_SECRET|DATABASE_URL|SMSIR_API_KEY|TOKEN|PASSWORD|API_KEY|SECRET)[^[:space:]]*/\1=[REDACTED]/Ig' "$log" > "$RUNNER_TEMP/bazigb-runtime-diagnostics/$(basename "$log")"
            else
              printf 'missing_log=%s\n' "$log" > "$RUNNER_TEMP/bazigb-runtime-diagnostics/$(basename "$log").missing"
            fi
          done
          {
            printf 'node=%s\nnpm=%s\nrunner_os=%s\n' "$(node --version)" "$(npm --version)" "${RUNNER_OS:-unknown}"
            printf 'runtime_state=%s\n' "$([ -f .local-runtime/state.json ] && echo present || echo absent)"
            printf 'env_names=\n'
            env | cut -d= -f1 | sort
            printf 'tracked_runtime_paths=\n'
            git status --short -- .local-runtime apps/server apps/web
          } > "$RUNNER_TEMP/bazigb-runtime-diagnostics/runtime-metadata.txt"
          {
            printf '%s\n' 'process_evidence='
            ps -eo pid=,ppid=,pgid=,stat=,comm=,args= | grep -E 'local-runtime|nest|next|bazigb' | grep -v grep || true
            printf '%s\n' 'listening_ports='
            (ss -H -ltnp 2>/dev/null || true) | grep -E ':3000|:3001' || true
          } | sed -E 's/(JWT_SECRET|DATABASE_URL|SMSIR_API_KEY|TOKEN|PASSWORD|API_KEY|SECRET)[^[:space:]]*/\1=[REDACTED]/Ig' > "$RUNNER_TEMP/bazigb-runtime-diagnostics/process-evidence.txt"
          cat "$RUNNER_TEMP/bazigb-runtime-diagnostics/runtime-metadata.txt"
          cat "$RUNNER_TEMP/bazigb-runtime-diagnostics/process-evidence.txt"

      - name: Upload sanitized runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazigb-runtime-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/bazigb-runtime-diagnostics
          retention-days: 7
          if-no-files-found: warn

      - name: Verify deployable release artifact
        run: npm run test:release-safety && npm run test:release-artifact
