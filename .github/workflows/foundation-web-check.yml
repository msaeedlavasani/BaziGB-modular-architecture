name: Foundation Web Check

on:
  push:
    branches:
      - refactor/platform-foundation-i18n-v3
  workflow_dispatch:

concurrency:
  group: foundation-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check AIPDE governance wiring
        run: npm run check:governance && npm run test:governance

      - name: Check Design System contracts
        run: npm run check:design-system && npm run test:design-system

      - name: Build shared game packages
        run: npm run build:packages

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Typecheck web
        run: npm run typecheck -w @bazigb/web

      - name: Build web
        run: npm run build:web
