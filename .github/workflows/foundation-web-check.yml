name: BaziGB CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bazigb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check AIPDE governance wiring
        run: npm run check:governance && npm run test:governance

      - name: Check task orchestration contracts
        run: npm run test:task-package

      - name: Guard schema, migration and generated changes
        run: npm run test:sensitive-diff && npm run check:sensitive-diff
        env:
          BAZIGB_DIFF_BASE: origin/main
          # DO-RELEASE-001: human-approved runtime datasource isolation change.
          # Exact-file and release-branch scope prevents reusable schema authority.
          BAZIGB_APPROVED_SENSITIVE_FILES: ${{ github.ref_name == 'codex/release-health-contract' && 'apps/server/src/prisma/prisma.service.ts' || '' }}

      - name: Check branch lifecycle fixtures
        run: npm run test:branch-health

      - name: Check Design System contracts
        run: npm run check:design-system && npm run test:design-system

  product-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @bazigb/server

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build shared game packages
        run: npm run build:packages

      - name: Check package boundaries
        run: npm run check:boundaries

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Test game rules
        run: npm run test:games

      - name: Test server
        run: npm run test -w @bazigb/server

      - name: Build web
        run: npm run build:web

      - name: Build server
        run: npm run build:server

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local BaziGB runtime
        run: npm run dev

      - name: Run loopback browser canary
        run: npm run test:browser-canary
        env:
          BAZIGB_BROWSER_CANARY_URL: http://127.0.0.1:3000

      - name: Stop local BaziGB runtime
        if: always()
        run: npm run dev:stop

      - name: Verify deployable release artifact
        run: npm run test:release-safety && npm run test:release-artifact
