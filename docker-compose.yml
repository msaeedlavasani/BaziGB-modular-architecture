# BaziGB — استقرار تولید (Zero Build)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazigb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bazigb-dev-pass}
      POSTGRES_DB: bazigb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazigb"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_TYPE: ${DB_TYPE:-file}
      DATABASE_URL: postgres://bazigb:${POSTGRES_PASSWORD:-CHANGE_ME}@db:5432/bazigb
      JWT_SECRET: ${JWT_SECRET:-bazigb-prod-secret}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://server:3001
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
